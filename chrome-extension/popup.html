<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 420px; padding: 16px; font-family: system-ui, -apple-system, sans-serif; background: #18181b; color: #f4f4f5; margin: 0; }
    h1 { font-size: 18px; margin: 0 0 4px 0; color: #c084fc; }
    .sub { font-size: 12px; color: #a1a1aa; margin-bottom: 14px; }
    label { display: block; font-size: 13px; margin-bottom: 4px; color: #d4d4d8; }
    input, select { width: 100%; padding: 8px 10px; border: 1px solid #3f3f46; border-radius: 8px; background: #27272a; color: #f4f4f5; font-size: 13px; box-sizing: border-box; margin-bottom: 10px; outline: none; }
    input:focus { border-color: #c084fc; }
    button { width: 100%; padding: 10px; border: none; border-radius: 8px; background: #7c3aed; color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #6d28d9; }
    button:disabled { opacity: 0.5; cursor: default; }
    .status { margin-top: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; }
    .status .info { color: #a1a1aa; }
    .status .ok { color: #4ade80; }
    .status .err { color: #f87171; }
    .status .item { padding: 4px 0; border-bottom: 1px solid #27272a; }
    .progress { margin-top: 10px; height: 4px; background: #27272a; border-radius: 2px; overflow: hidden; display: none; }
    .progress div { height: 100%; background: #7c3aed; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <h1>📦 Fábrica de Reels</h1>
  <p class="sub">Baixa todos os Reels de um perfil do Instagram</p>

  <label for="url">Link do perfil ou username</label>
  <input type="text" id="url" placeholder="https://www.instagram.com/vovoteodoro/" autofocus>

  <label for="limit">Máximo de reels (0 = baixar <strong>todos</strong>)</label>
  <input type="number" id="limit" value="0" min="0">

  <button id="btn">🔽 Baixar Reels</button>

  <div class="progress" id="progressBar"><div id="progressFill"></div></div>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
