<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analytics - Fábrica de Reels</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f0f13;
  color: #e0e0e0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.container { max-width: 1100px; margin: 0 auto; padding: 20px; width: 100%; }

header {
  background: linear-gradient(135deg, #1a1a2e, #16213e);
  border-bottom: 1px solid #2a2a4a;
  padding: 16px 0;
}
header h1 { font-size: 22px; font-weight: 700; }
header h1 span { color: #fbbf24; }
.header-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.header-bar .updated { font-size: 12px; color: #888; }
.refresh-btn {
  background: #2563eb; color: #fff; border: none; padding: 8px 20px;
  border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all .2s;
}
.refresh-btn:hover { background: #1d4ed8; }
.refresh-btn:disabled { opacity: .5; cursor: not-allowed; }

/* Tabs */
.tabs {
  display: flex; gap: 4px; background: #1a1a2e; border-radius: 10px; padding: 4px;
  margin-bottom: 24px;
}
.tab {
  flex: 1; padding: 10px; border: none; background: transparent; color: #888;
  font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px;
  transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.tab:hover { color: #ccc; background: #2a2a4a; }
.tab.active { background: #2563eb; color: #fff; }
.tab .tab-icon { font-size: 18px; }

/* Grid */
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.card {
  background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #2a2a4a;
  transition: all .2s;
}
.card:hover { border-color: #2563eb; transform: translateY(-2px); }
.card .label { font-size: 11px; text-transform: uppercase; color: #888; letter-spacing: .5px; margin-bottom: 6px; }
.card .value { font-size: 28px; font-weight: 700; color: #fff; }
.card .value.blue { color: #60a5fa; }
.card .value.green { color: #34d399; }
.card .value.yellow { color: #fbbf24; }
.card .value.pink { color: #f472b6; }
.card .value.purple { color: #a78bfa; }

/* Status */
.panel-status {
  margin-top: 20px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
  padding: 12px; border-radius: 8px; background: #1a1a2e; font-size: 13px;
}
.panel-status .dot { width: 8px; height: 8px; border-radius: 50%; }
.panel-status .dot.ok { background: #34d399; }
.panel-status .dot.erro { background: #f87171; }

/* Platform header inside tab content */
.platform-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
}
.platform-header .big-icon { font-size: 36px; }
.platform-header h2 { font-size: 20px; font-weight: 700; }
.platform-header .username { font-size: 13px; color: #888; }

.error-msg {
  background: #3b1a1a; border: 1px solid #7f1d1d; color: #fca5a5;
  padding: 12px 16px; border-radius: 8px; font-size: 13px;
}

@media (max-width: 600px) {
  .container { padding: 12px; }
  .card .value { font-size: 22px; }
  .tabs { flex-direction: column; }
}
</style>
</head>
<body>
<header>
  <div class="container">
    <div class="header-bar">
      <h1>&#9654; <span>Analytics</span> &mdash; F&aacute;brica de Reels</h1>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="updated" id="updatedLabel">carregando...</span>
        <button class="refresh-btn" id="refreshBtn">&#x21bb; Atualizar</button>
      </div>
    </div>
  </div>
</header>

<div class="container" style="padding-top:24px">
  <div class="tabs" id="tabBar"></div>
  <div id="tabContent"></div>
</div>

<script>
const PLATFORMS = [
  { id: 'instagram', icon: '&#x1f4f7;', label: 'Instagram' },
  { id: 'tiktok',    icon: '&#x266a;',  label: 'TikTok' },
  { id: 'facebook',  icon: '&#x1f464;', label: 'Facebook' },
  { id: 'youtube',   icon: '&#x25b6;',  label: 'YouTube' },
];

const CARD_DEFS = {
  instagram: [
    { key: 'posts',      label: 'Posts',       color: 'blue' },
    { key: 'seguidores', label: 'Seguidores',   color: 'pink' },
    { key: 'seguindo',   label: 'Seguindo',     color: 'yellow' },
  ],
  tiktok: [
    { key: 'videos',     label: 'Vídeos',       color: 'purple' },
    { key: 'seguidores', label: 'Seguidores',   color: 'pink' },
    { key: 'curtidas',   label: 'Curtidas',     color: 'green' },
  ],
  facebook: [
    { key: 'seguidores', label: 'Seguidores',   color: 'blue' },
    { key: 'curtidas',   label: 'Curtidas',     color: 'yellow' },
  ],
  youtube: [
    { key: 'videos',         label: 'Vídeos',        color: 'purple' },
    { key: 'inscritos',      label: 'Inscritos',     color: 'blue' },
    { key: 'visualizacoes',  label: 'Visualizações', color: 'green' },
  ],
};

let data = null;
let activeTab = 'instagram';

function buildTabBar() {
  const bar = document.getElementById('tabBar');
  bar.innerHTML = PLATFORMS.map(p => `
    <button class="tab ${p.id === activeTab ? 'active' : ''}" data-tab="${p.id}">
      <span class="tab-icon">${p.icon}</span> ${p.label}
    </button>
  `).join('');
  bar.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      buildTabBar();
      renderContent();
    });
  });
}

function renderContent() {
  const container = document.getElementById('tabContent');
  const platform = PLATFORMS.find(p => p.id === activeTab);
  const pdata = data?.platforms?.[activeTab];
  const cards = CARD_DEFS[activeTab] || [];

  if (!pdata || pdata.status === 'error') {
    const err = pdata?.error || 'Dados não disponíveis';
    container.innerHTML = `
      <div class="platform-header">
        <span class="big-icon">${platform.icon}</span>
        <div>
          <h2>${platform.label}</h2>
          <span class="username">${pdata?.username || '---'}</span>
        </div>
      </div>
      <div class="error-msg">Erro: ${err}</div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="platform-header">
      <span class="big-icon">${platform.icon}</span>
      <div>
        <h2>${platform.label}</h2>
        <span class="username">@${pdata.username}</span>
      </div>
    </div>
    <div class="grid">
      ${cards.map(c => {
        const raw = pdata.stats?.[c.key] || '0';
        const val = pdata.stats?.[c.key + 'Num'] ?? 0;
        const fmt = val >= 1000 ? (val >= 1000000 ? (val / 1000000).toFixed(1) + 'M' : (val / 1000).toFixed(1) + 'K') : String(val);
        return `<div class="card">
          <div class="label">${c.label}</div>
          <div class="value ${c.color}">${fmt}</div>
        </div>`;
      }).join('')}
    </div>
  `;
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.textContent = '↻ Atualizando...';

  try {
    const res = await fetch('/api/analytics');
    data = await res.json();
    const d = new Date(data.scrapedAt);
    document.getElementById('updatedLabel').textContent = 'Última atualização: ' + d.toLocaleString('pt-BR');
    renderContent();
  } catch (e) {
    document.getElementById('updatedLabel').textContent = 'Erro ao carregar';
  } finally {
    btn.disabled = false;
    btn.textContent = '↻ Atualizar';
  }
}

async function refreshData() {
  try {
    await fetch('/api/analytics/refresh', { method: 'POST' });
  } catch (e) {}
  await loadData();
}

document.getElementById('refreshBtn').addEventListener('click', refreshData);

buildTabBar();
loadData();
</script>
</body>
</html>
