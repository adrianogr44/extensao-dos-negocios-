<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fabrica de Reels — Studio</title>
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161618;
  --surface2: #1e1e21;
  --surface3: #28282c;
  --border: #2a2a2e;
  --text: #f1f1f3;
  --text2: #a1a1aa;
  --text3: #63636b;
  --accent: #ff0050;
  --accent-hover: #e00045;
  --ig: #0095f6;
  --tt: #ff0050;
  --green: #10b981;
  --yellow: #f59e0b;
  --red: #ef4444;
  --radius: 12px;
  --radius-sm: 8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex}

/* Sidebar */
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;position:sticky;top:0;height:100vh;flex-shrink:0}
.sidebar-header{padding:20px 16px 16px;border-bottom:1px solid var(--border)}
.sidebar-header h1{font-size:15px;font-weight:700;letter-spacing:-0.2px;display:flex;align-items:center;gap:8px}
.sidebar-header .logo{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),#7c3aed);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff}
.sidebar-header .sub{font-size:11px;color:var(--text3);margin-top:4px;margin-left:36px}
.nav{flex:1;padding:8px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;margin:2px 8px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:.1s;border:none;background:none;width:calc(100% - 16px);text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--surface3);color:var(--text)}
.nav-item .icon{width:20px;text-align:center;font-size:16px}
.nav-item .badge-nav{font-size:10px;padding:1px 6px;border-radius:10px;background:var(--accent);color:#fff;margin-left:auto}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.topbar-left{display:flex;align-items:center;gap:16px}
.topbar-left h2{font-size:17px;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:12px}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.status-dot.idle{background:var(--text3)}
.status-dot.running{background:var(--green);animation:pulse 1.5s infinite}
.status-dot.done{background:var(--green)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-label{font-size:13px;color:var(--text2)}

.content{flex:1;padding:24px 28px;overflow-y:auto;max-height:calc(100vh - 61px)}

/* Panels */
.panel{display:none}
.panel.active{display:block}

/* Stats Grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:var(--radius);padding:16px 18px;border:1px solid var(--border);position:relative;overflow:hidden}
.stat-card .stat-icon{font-size:20px;margin-bottom:6px}
.stat-card .stat-val{font-size:24px;font-weight:700;line-height:1.2}
.stat-card .stat-lbl{font-size:12px;color:var(--text2);margin-top:2px}
.stat-card .stat-bar{position:absolute;bottom:0;left:0;height:3px;background:var(--border);width:100%}
.stat-card .stat-bar-fill{height:100%;border-radius:0 2px 0 0;transition:width .5s}
.stat-card.ig .stat-bar-fill{background:var(--ig)}
.stat-card.tt .stat-bar-fill{background:var(--tt)}
.stat-card.both .stat-bar-fill{background:var(--green)}
.stat-card.pending .stat-bar-fill{background:var(--yellow)}
.stat-card.error .stat-bar-fill{background:var(--red)}

/* Schedule Bar */
.schedule-bar{background:var(--surface);border-radius:var(--radius);padding:14px 18px;margin-bottom:20px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.schedule-bar .label{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px}
.schedule-bar .label .icon-clock{font-size:15px}
.schedule-bar .time{color:var(--accent);font-weight:600}
.schedule-bar .next{font-size:12px;color:var(--text3)}

/* Action Buttons */
.actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:9px 18px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:.1s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{opacity:.9;transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#dc2626}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-outline:hover{background:var(--surface2);color:var(--text)}
.btn-sm{padding:6px 12px;font-size:11px}
.btn-icon{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center}

/* Log Panel */
.log-panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);overflow:hidden;margin-bottom:20px}
.log-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border)}
.log-header .log-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.log-body{height:260px;overflow-y:auto;padding:10px 14px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:12px;line-height:1.7;background:#08080a}
.log-body .line{padding:1px 0;white-space:pre-wrap;word-break:break-all}
.log-body .stdout{color:#d4d4d8}
.log-body .stderr{color:var(--red)}
.log-body .system{color:#7c3aed;font-weight:600}
.log-body .error{color:var(--red);font-weight:600}
.log-body .ts{color:var(--text3);margin-right:10px;font-size:11px;user-select:none}
.log-body::-webkit-scrollbar{width:4px}
.log-body::-webkit-scrollbar-track{background:transparent}
.log-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* Video Queue */
.queue-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.queue-header h3{font-size:14px;font-weight:600}
.queue-header .count{font-size:12px;color:var(--text3)}
.queue-header .count strong{color:var(--text2)}

.video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.video-card{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius-sm);padding:10px 14px;border:1px solid var(--border);transition:.1s;font-size:13px}
.video-card:hover{border-color:var(--text3)}
.video-card .v-num{width:24px;height:24px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text3);flex-shrink:0}
.video-card .v-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.video-card .v-platforms{display:flex;gap:6px;flex-shrink:0}
.video-card .v-platform{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600}
.video-card .v-platform.ig-done{background:rgba(0,149,246,.15);color:var(--ig)}
.video-card .v-platform.ig-pending{background:rgba(0,149,246,.08);color:var(--text3)}
.video-card .v-platform.tt-done{background:rgba(255,0,80,.15);color:var(--tt)}
.video-card .v-platform.tt-pending{background:rgba(255,0,80,.08);color:var(--text3)}
.video-card .v-err{color:var(--red);font-size:11px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}

/* Tabs */
.tabs{display:flex;gap:2px;margin-bottom:20px;background:var(--surface);border-radius:var(--radius-sm);padding:3px;border:1px solid var(--border);width:fit-content}
.tab{padding:7px 16px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:.1s;background:transparent;color:var(--text2)}
.tab:hover{color:var(--text)}
.tab.active{background:var(--surface3);color:var(--text)}

/* Schedule Panel */
.schedule-panel{background:var(--surface);border-radius:var(--radius);padding:18px;border:1px solid var(--border)}
.schedule-panel .sched-row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--border)}
.schedule-panel .sched-row:last-child{border:none}
.sched-row .sched-time{font-size:14px;font-weight:600;width:50px}
.sched-row .sched-bar{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.sched-row .sched-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),#7c3aed)}
.sched-row .sched-label{font-size:12px;color:var(--text2);width:80px;text-align:right}
.sched-row .sched-dot{width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:4px;display:inline-block}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:13px;margin-top:4px}

/* Filter bar */
.filter-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filter-btn{padding:5px 12px;border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;background:transparent;color:var(--text2);transition:.1s}
.filter-btn:hover{background:var(--surface2)}
.filter-btn.active{background:var(--surface3);color:var(--text);border-color:var(--text3)}

@media(max-width:768px){
  .sidebar{display:none}
  .content{padding:16px}
  .topbar{padding:12px 16px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .video-grid{grid-template-columns:1fr}
  .schedule-bar{flex-direction:column;align-items:flex-start}
  .tabs{width:100%;overflow-x:auto}
}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sidebar-header">
    <h1><span class="logo">F</span> Fabrica Reels</h1>
    <div class="sub">Automacao de Postagem</div>
  </div>
  <div class="nav">
    <button class="nav-item active" data-tab="dashboard"><span class="icon">&#9632;</span> Dashboard</button>
    <button class="nav-item" data-tab="videos"><span class="icon">&#9654;</span> Videos <span class="badge-nav" id="navPending">0</span></button>
    <button class="nav-item" data-tab="schedule"><span class="icon">&#9200;</span> Agenda</button>
    <button class="nav-item" data-tab="logs"><span class="icon">&#128214;</span> Logs</button>
  </div>
  <div style="padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--text3)" id="sidebarClock"></div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <h2 id="pageTitle">Dashboard</h2>
    </div>
    <div class="topbar-right">
      <span><span class="status-dot idle" id="statusDot"></span><span class="status-label" id="statusLabel">Parado</span></span>
    </div>
  </div>

  <div class="content">

    <!-- DASHBOARD -->
    <div class="panel active" id="panel-dashboard">
      <div class="stats-grid" id="statsGrid"></div>

      <div class="schedule-bar">
        <span class="label"><span class="icon-clock">&#9200;</span> Agendado: <span class="time" id="schedTimes">06:00 (5 videos)</span></span>
        <span class="next">Proximo: <span id="nextRun">-</span></span>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="btnRun">&#9654; Executar Agora</button>
        <button class="btn btn-danger" id="btnStop" disabled>&#9632; Parar</button>
        <button class="btn btn-outline" onclick="openChrome()">&#127760; Abrir Chrome</button>
        <button class="btn btn-outline" onclick="resetPosted()">&#8635; Zerar Postados</button>
        <button class="btn btn-outline" onclick="resetDaily()">&#128197; Zerar Hoje</button>
        <button class="btn btn-outline" onclick="resetErrors()">&#10003; Zerar Erros</button>
      </div>
    </div>

    <!-- VIDEOS -->
    <div class="panel" id="panel-videos">
      <div class="queue-header">
        <h3>Fila de Videos</h3>
        <span class="count"><strong id="videoCount">0</strong> videos</span>
      </div>
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="pending">Pendentes</button>
        <button class="filter-btn" data-filter="done">Concluidos</button>
        <button class="filter-btn" data-filter="error">Com Erro</button>
      </div>
      <div class="video-grid" id="videoGrid"></div>
    </div>

    <!-- SCHEDULE -->
    <div class="panel" id="panel-schedule">
      <div class="schedule-panel" id="schedulePanel"></div>
    </div>

    <!-- LOGS -->
    <div class="panel" id="panel-logs">
      <div class="log-panel" style="margin:0">
        <div class="log-header">
          <span class="log-title">&#128214; Log de Execucao</span>
          <button class="btn btn-sm btn-outline" onclick="clearLog()">Limpar</button>
        </div>
        <div class="log-body" id="logBody">
          <div class="line system"><span class="ts">agora</span>Conectando ao servidor...</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const BASE = '';
let isRunning = false;
let statsInterval = null;
let eventSource = null;
let currentFilter = 'all';
let currentQueue = { videos: [] };

function fmtTime(d) {
  return d.toLocaleTimeString('pt-BR', { hour12: false });
}

function updateClock() {
  const now = new Date();
  document.getElementById('sidebarClock').textContent = now.toLocaleString('pt-BR');
}

document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('panel-' + el.dataset.tab).classList.add('active');
    document.getElementById('pageTitle').textContent = el.textContent.trim();
  });
});

document.querySelectorAll('.filter-btn').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    currentFilter = el.dataset.filter;
    renderQueue(currentQueue);
  });
});

function updateStatus(running, concluido) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  if (concluido) {
    dot.className = 'status-dot done';
    label.textContent = 'Concluido';
  } else if (running) {
    dot.className = 'status-dot running';
    label.textContent = 'Executando';
  } else {
    dot.className = 'status-dot idle';
    label.textContent = 'Parado';
  }
}

async function fetchJson(url) {
  const r = await fetch(url);
  return r.json();
}

async function loadStats() {
  try {
    const s = await fetchJson(BASE + '/api/stats');
    renderStats(s);
  } catch {}
}

async function loadSchedule() {
  try {
    const s = await fetchJson(BASE + '/api/schedule');
    const times = s.nextRuns.map(r => `${r.time} (${r.videos} videos)`).join(', ');
    document.getElementById('schedTimes').textContent = times || '06:00 (5 videos)';
    document.getElementById('nextRun').textContent = s.nextRuns.length ? s.nextRuns[0].next : '-';
    renderSchedule(s);
  } catch {}
}

function renderStats(s) {
  const allDone = s.total > 0 && s.pending === 0;
  if (allDone) updateStatus(false, true);
  const pctTotal = s.total > 0 ? Math.round(s.bothPosted / s.total * 100) : 0;
  const pctIG = s.total > 0 ? Math.round(s.igPosted / s.total * 100) : 0;
  const pctTT = s.total > 0 ? Math.round(s.ttPosted / s.total * 100) : 0;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card ig">
      <div class="stat-icon">&#9679;</div>
      <div class="stat-val">${s.igPosted}</div>
      <div class="stat-lbl">Instagram</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${pctIG}%"></div></div>
    </div>
    <div class="stat-card tt">
      <div class="stat-icon">&#9654;</div>
      <div class="stat-val">${s.ttPosted}</div>
      <div class="stat-lbl">TikTok</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${pctTT}%"></div></div>
    </div>
    <div class="stat-card both">
      <div class="stat-icon">&#10003;</div>
      <div class="stat-val">${s.bothPosted}</div>
      <div class="stat-lbl">Ambas Plataformas</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${pctTotal}%"></div></div>
    </div>
    <div class="stat-card pending">
      <div class="stat-icon">&#9203;</div>
      <div class="stat-val">${s.pending}</div>
      <div class="stat-lbl">Pendentes</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${pctTotal}%"></div></div>
    </div>
    <div class="stat-card ig">
      <div class="stat-icon">&#128197;</div>
      <div class="stat-val">${s.dailyCount} <span style="font-size:14px;color:var(--text3)">/ ${s.dailyLimit}</span></div>
      <div class="stat-lbl">Postados hoje (IG)</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${s.dailyLimit > 0 ? (s.dailyCount / s.dailyLimit * 100) : 0}%"></div></div>
    </div>
    <div class="stat-card tt">
      <div class="stat-icon">&#128197;</div>
      <div class="stat-val">${s.dailyCountTikTok} <span style="font-size:14px;color:var(--text3)">/ ${s.dailyLimit}</span></div>
      <div class="stat-lbl">Postados hoje (TT)</div>
      <div class="stat-bar"><div class="stat-bar-fill" style="width:${s.dailyLimit > 0 ? (s.dailyCountTikTok / s.dailyLimit * 100) : 0}%"></div></div>
    </div>
    ${s.withErrors > 0 ? `
    <div class="stat-card error">
      <div class="stat-icon">&#9888;</div>
      <div class="stat-val">${s.withErrors}</div>
      <div class="stat-lbl">Com Erros</div>
    </div>` : ''}
  `;
  document.getElementById('navPending').textContent = s.pending;
}

function renderSchedule(s) {
  const container = document.getElementById('schedulePanel');
  container.innerHTML = `
    <div style="margin-bottom:14px;font-size:13px;color:var(--text2)">
      Fuso: <strong>${s.timezone}</strong> &middot; Intervalo de 1h entre posts
    </div>
    ${s.nextRuns.map(r => {
      const pct = r.videos / 5 * 100;
      return `
        <div class="sched-row">
          <span class="sched-dot"></span>
          <span class="sched-time">${r.time}</span>
          <div class="sched-bar"><div class="sched-bar-fill" style="width:${pct}%"></div></div>
          <span class="sched-label">${r.videos} videos</span>
          <span style="font-size:11px;color:var(--text3)">${r.next}</span>
        </div>
      `;
    }).join('')}
  `;
}

async function loadQueue() {
  try {
    currentQueue = await fetchJson(BASE + '/api/queue');
    renderQueue(currentQueue);
    document.getElementById('videoCount').textContent = currentQueue.videos.length;
  } catch {}
}

function renderQueue(q) {
  const container = document.getElementById('videoGrid');
  const filtered = currentFilter === 'all' ? q.videos
    : currentFilter === 'pending' ? q.videos.filter(v => !v.postedInstagram || !v.postedTikTok)
    : currentFilter === 'done' ? q.videos.filter(v => v.postedInstagram && v.postedTikTok)
    : currentFilter === 'error' ? q.videos.filter(v => v.error)
    : q.videos;

  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">&#9654;</div><p>Nenhum video ${currentFilter !== 'all' ? 'com este filtro' : 'na fila'}</p><p style="font-size:12px;color:var(--text3)">Adicione videos a pasta FabricaReels</p></div>`;
    return;
  }

  container.innerHTML = filtered.map((v, i) => {
    const igClass = v.postedInstagram ? 'ig-done' : 'ig-pending';
    const ttClass = v.postedTikTok ? 'tt-done' : 'tt-pending';
    const igLabel = v.postedInstagram ? 'IG' : 'IG';
    const ttLabel = v.postedTikTok ? 'TT' : 'TT';
    return `
      <div class="video-card">
        <span class="v-num">${q.videos.indexOf(v) + 1}</span>
        <span class="v-name" title="${v.filename}">${v.filename}</span>
        <div class="v-platforms">
          <span class="v-platform ${igClass}">${igLabel}</span>
          <span class="v-platform ${ttClass}">${ttLabel}</span>
        </div>
        ${v.error ? `<span class="v-err" title="${v.error}">${v.error}</span>` : ''}
      </div>
    `;
  }).join('');
}

async function runScript() {
  try {
    const r = await fetch(BASE + '/api/run', { method: 'POST' });
    const data = await r.json();
    if (!data.ok) addLog('error', data.error || 'Erro ao iniciar');
  } catch (e) {
    addLog('error', 'Erro de conexao: ' + e.message);
  }
}

async function stopScript() {
  try { await fetch(BASE + '/api/stop', { method: 'POST' }); } catch {}
}

async function openChrome() {
  try { await fetch(BASE + '/api/chrome', { method: 'POST' }); } catch {}
}

async function resetPosted() {
  if (!confirm('Zerar status de postagem de TODOS os videos?')) return;
  try {
    await fetch(BASE + '/api/queue/reset-posted', { method: 'POST' });
    addLog('system', 'Status de postagem resetado para todos os videos');
    loadQueue(); loadStats();
  } catch {}
}

async function resetDaily() {
  try {
    await fetch(BASE + '/api/queue/reset-daily', { method: 'POST' });
    addLog('system', 'Contagem diaria zerada');
    loadStats();
  } catch {}
}

async function resetErrors() {
  try {
    await fetch(BASE + '/api/queue/reset-errors', { method: 'POST' });
    addLog('system', 'Erros limpos de todos os videos');
    loadQueue(); loadStats();
  } catch {}
}

async function resetQueue() {
  if (!confirm('Tem certeza? Todos os videos serao marcados como nao postados.')) return;
  try {
    await fetch(BASE + '/api/queue/reset', { method: 'POST' });
    loadQueue();
    loadStats();
  } catch {}
}

function addLog(type, text) {
  const body = document.getElementById('logBody');
  const line = document.createElement('div');
  line.className = 'line ' + type;
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = fmtTime(new Date());
  line.appendChild(ts);
  line.appendChild(document.createTextNode(text));
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}

function clearLog() {
  document.getElementById('logBody').innerHTML = '';
}

function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(BASE + '/api/log');
  eventSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'connected') return;
      addLog(data.type, data.text);
      if (data.type === 'system' && data.text.includes('Processo encerrado')) {
        isRunning = false;
        updateStatus(false);
        document.getElementById('btnRun').disabled = false;
        document.getElementById('btnStop').disabled = true;
        loadQueue();
        loadStats();
      }
      if (data.type === 'system' && data.text.includes('Iniciando postagem')) {
        isRunning = true;
        updateStatus(true);
        document.getElementById('btnRun').disabled = true;
        document.getElementById('btnStop').disabled = false;
      }
    } catch {}
  };
  eventSource.onerror = () => {
    addLog('system', 'Conexao perdida, reconectando em 3s...');
    setTimeout(connectSSE, 3000);
  };
}

updateClock();
setInterval(updateClock, 1000);
connectSSE();
loadStats();
loadSchedule();
loadQueue();
statsInterval = setInterval(() => { if (!isRunning) { loadStats(); loadQueue(); } }, 5000);

window.addEventListener('beforeunload', () => {
  if (eventSource) eventSource.close();
  if (statsInterval) clearInterval(statsInterval);
});
</script>
</body>
</html>
