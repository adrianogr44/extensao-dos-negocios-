<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio — Fábrica de Reels</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#121214;color:#f4f4f5;min-height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:#202024;border-bottom:1px solid #2f2f35;position:sticky;top:0;z-index:50}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.header h1 span.purple{color:#c084fc}
.header h1 span.gray{color:#f4f4f5}
.header-right{display:flex;align-items:center;gap:10px;font-size:13px}
.badge{font-size:11px;padding:3px 10px;border-radius:5px;font-weight:600}
.badge-done{background:rgba(16,185,129,0.2);color:#10b981}
.badge-ig{background:rgba(0,149,246,0.15);color:#0095f6}
.badge-tt{background:rgba(255,0,80,0.15);color:#ff0050}
.badge-both{background:rgba(16,185,129,0.15);color:#10b981}
.badge-idle{background:rgba(113,113,122,0.2);color:#a1a1aa}
.badge-running{background:rgba(196,132,252,0.2);color:#c084fc}
.container{max-width:1100px;margin:0 auto;padding:20px}

.stats{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{background:#202024;border-radius:10px;padding:14px 18px;flex:1;min-width:100px;border:1px solid #2f2f35}
.stat-card .val{font-size:22px;font-weight:700}
.stat-card .lbl{font-size:11px;color:#71717a;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.stat-card.limit .val{font-size:18px}
.stat-card.ig .val{color:#0095f6}
.stat-card.tt .val{color:#ff0050}
.stat-card.both .val{color:#10b981}
.stat-card.done .val{color:#10b981;font-size:26px}
.stat-card.pending .val{color:#f59e0b}
.stat-card.error .val{color:#ef4444}

.actions{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.btn{padding:9px 20px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px);opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-primary{background:#7c3aed;color:#fff}
.btn-primary:hover{background:#6d28d9}
.btn-danger{background:#dc2626;color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-ig{background:#0095f6;color:#fff}
.btn-tt{background:#ff0050;color:#fff}
.btn-outline{background:transparent;color:#a1a1aa;border:1px solid #2f2f35}
.btn-outline:hover{background:#2f2f35;color:#f4f4f5}
.btn-sm{padding:6px 12px;font-size:11px}

.log-panel{background:#0d0d0f;border-radius:10px;border:1px solid #2f2f35;margin-bottom:20px;overflow:hidden}
.log-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#151518;border-bottom:1px solid #2f2f35}
.log-header span{font-size:12px;font-weight:600;color:#71717a;text-transform:uppercase;letter-spacing:0.5px}
.log-body{height:280px;overflow-y:auto;padding:12px 16px;font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;font-size:12px;line-height:1.6}
.log-body .line{white-space:pre-wrap;word-break:break-all}
.log-body .stdout{color:#d4d4d8}
.log-body .stderr{color:#ef4444}
.log-body .system{color:#7c3aed;font-weight:600}
.log-body .error{color:#ef4444;font-weight:600}
.log-body .ts{color:#52525b;margin-right:8px;font-size:11px}
.log-body::-webkit-scrollbar{width:5px}
.log-body::-webkit-scrollbar-track{background:transparent}
.log-body::-webkit-scrollbar-thumb{background:#2f2f35;border-radius:3px}

.videos{display:flex;flex-direction:column;gap:6px}
.video-row{display:flex;align-items:center;gap:12px;background:#202024;border-radius:8px;padding:10px 14px;border:1px solid #2f2f35;font-size:13px}
.video-row .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d4d4d8}
.video-row .status{display:flex;gap:8px;font-size:11px;font-weight:600}
.video-row .status .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.video-row .status .dot.ig{background:#0095f6}
.video-row .status .dot.tt{background:#ff0050}
.video-row .status .dot.done{background:#10b981}
.video-row .status .dot.fail{background:#ef4444}
.video-row .err-msg{color:#ef4444;font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty{text-align:center;padding:40px 20px;color:#52525b;font-size:14px}
.empty p{margin-top:6px;color:#3f3f46;font-size:12px}

@media(max-width:640px){
  .header{padding:10px 14px;flex-wrap:wrap;gap:8px}
  .container{padding:12px}
  .stats{gap:8px}
  .stat-card{padding:10px 14px;min-width:calc(50% - 4px)}
  .stat-card .val{font-size:18px}
  .video-row{flex-wrap:wrap;padding:8px 10px;gap:6px}
  .video-row .name{width:100%}
}
</style>
</head>
<body>
<div class="header">
  <h1><span class="purple">&#9670;</span> <span class="gray">Studio — Fábrica de Reels</span></h1>
  <div class="header-right">
    <span id="statusBadge" class="badge badge-idle">Parado</span>
    <span style="color:#52525b;font-size:12px" id="headerClock"></span>
  </div>
</div>
<div class="container">
  <div class="stats" id="stats"></div>

  <div class="schedule-bar" id="scheduleBar" style="background:#151518;border-radius:8px;padding:10px 16px;margin-bottom:16px;border:1px solid #2f2f35;font-size:13px;display:flex;justify-content:space-between;align-items:center">
    <span style="color:#71717a">Agendado: <span id="scheduleTimes" style="color:#c084fc;font-weight:600">06:30 (2), 11:30 (3)</span> (Sao Paulo)</span>
    <span id="nextRun" style="color:#52525b;font-size:12px"></span>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btnRun" onclick="runScript()">&#9654; Executar Agora</button>
    <button class="btn btn-danger" id="btnStop" onclick="stopScript()" disabled>&#9632; Parar</button>
    <button class="btn btn-outline" onclick="openChrome()">&#127760; Abrir Chrome</button>
    <button class="btn btn-outline" onclick="resetQueue()">&#8635; Resetar Fila</button>
  </div>

  <div class="log-panel">
    <div class="log-header">
      <span>&#128214; Log</span>
      <button class="btn btn-sm btn-outline" onclick="clearLog()">Limpar</button>
    </div>
    <div class="log-body" id="logBody">
      <div class="line system">Conectando ao servidor...</div>
    </div>
  </div>

  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <span style="font-size:13px;font-weight:600;color:#a1a1aa">FILA DE VÍDEOS</span>
    <span id="videoCount" style="font-size:12px;color:#52525b"></span>
  </div>
  <div class="videos" id="videos"></div>
</div>

<script>
const BASE = '';
let isRunning = false;
let statsInterval = null;
let eventSource = null;

function fmtTime(d) {
  return d.toLocaleTimeString('pt-BR', { hour12: false });
}

function updateClock() {
  const now = new Date();
  document.getElementById('headerClock').textContent = now.toLocaleString('pt-BR');
}

function updateStatusBadge(running, concluido = false) {
  const b = document.getElementById('statusBadge');
  if (concluido) {
    b.textContent = 'Conclu\u00eddo';
    b.className = 'badge badge-done';
  } else if (running) {
    b.textContent = 'Executando';
    b.className = 'badge badge-running';
  } else {
    b.textContent = 'Parado';
    b.className = 'badge badge-idle';
  }
}

async function fetchJson(url) {
  const r = await fetch(url);
  return r.json();
}

async function loadStats() {
  try {
    const s = await fetchJson(BASE + '/api/stats');
    renderStats(s);
  } catch {}
}

async function loadSchedule() {
  try {
    const s = await fetchJson(BASE + '/api/schedule');
    document.getElementById('scheduleTimes').textContent = s.nextRuns.map(r => `${r.time} (${r.videos})`).join(', ');
    if (s.nextRuns.length) {
      document.getElementById('nextRun').textContent = `Proximo: ${s.nextRuns[0].next}`;
    }
  } catch {}
}

function renderStats(s) {
  const allDone = s.total > 0 && s.pending === 0;
  if (allDone) updateStatusBadge(false, true);
  document.getElementById('stats').innerHTML = `
    <div class="stat-card ig"><div class="val">${s.igPosted}</div><div class="lbl">Instagram</div></div>
    <div class="stat-card tt"><div class="val">${s.ttPosted}</div><div class="lbl">TikTok</div></div>
    <div class="stat-card both"><div class="val">${s.bothPosted}</div><div class="lbl">Ambos</div></div>
    <div class="stat-card pending"><div class="val">${s.pending}</div><div class="lbl">Pendentes</div></div>
    <div class="stat-card limit"><div class="val">${s.dailyCount} / ${s.dailyLimit}</div><div class="lbl">Limite IG hoje</div></div>
    <div class="stat-card limit"><div class="val" style="color:#ff0050">${s.dailyCountTikTok} / ${s.dailyLimit}</div><div class="lbl">Limite TT hoje</div></div>
    ${s.withErrors > 0 ? `<div class="stat-card error"><div class="val">${s.withErrors}</div><div class="lbl">Com Erros</div></div>` : ''}
    ${allDone ? '<div class="stat-card done"><div class="val">&#10003;</div><div class="lbl">Conclu\u00eddo</div></div>' : ''}
  `;
}

async function loadQueue() {
  try {
    const q = await fetchJson(BASE + '/api/queue');
    renderQueue(q);
    document.getElementById('videoCount').textContent = `${q.videos.length} videos`;
  } catch {}
}

function statusIcon(v) {
  const ig = v.postedInstagram ? '<span class="dot done"></span>' : '<span class="dot ig"></span>';
  const tt = v.postedTikTok ? '<span class="dot done"></span>' : '<span class="dot tt"></span>';
  return `${ig} IG ${tt} TT`;
}

function renderQueue(q) {
  const container = document.getElementById('videos');
  if (!q.videos.length) {
    container.innerHTML = '<div class="empty">Nenhum v\u00eddeo na fila<p>Adicione v\u00eddeos \u00e0 pasta FabricaReels</p></div>';
    return;
  }
  container.innerHTML = q.videos.map((v, i) => `
    <div class="video-row">
      <span class="name" title="${v.filename}">${v.filename}</span>
      <span class="status">${statusIcon(v)}</span>
      ${v.error ? `<span class="err-msg" title="${v.error}">${v.error}</span>` : ''}
    </div>
  `).join('');
}

async function runScript() {
  try {
    const r = await fetch(BASE + '/api/run', { method: 'POST' });
    const data = await r.json();
    if (!data.ok) {
      addLog('error', data.error || 'Erro ao iniciar');
    }
  } catch (e) {
    addLog('error', 'Erro de conexao: ' + e.message);
  }
}

async function stopScript() {
  try {
    await fetch(BASE + '/api/stop', { method: 'POST' });
  } catch {}
}

async function openChrome() {
  try {
    await fetch(BASE + '/api/chrome', { method: 'POST' });
  } catch {}
}

async function resetQueue() {
  if (!confirm('Tem certeza? Todos os videos serao marcados como nao postados.')) return;
  try {
    await fetch(BASE + '/api/queue/reset', { method: 'POST' });
    loadQueue();
    loadStats();
  } catch {}
}

function addLog(type, text) {
  const body = document.getElementById('logBody');
  const line = document.createElement('div');
  line.className = 'line ' + (type === 'stderr' ? 'stderr' : type === 'system' ? 'system' : type === 'error' ? 'error' : 'stdout');
  const ts = document.createElement('span');
  ts.className = 'ts';
  ts.textContent = fmtTime(new Date());
  line.appendChild(ts);
  line.appendChild(document.createTextNode(text));
  body.appendChild(line);
  body.scrollTop = body.scrollHeight;
}

function clearLog() {
  document.getElementById('logBody').innerHTML = '';
}

function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(BASE + '/api/log');
  eventSource.onmessage = (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.type === 'connected') return;
      addLog(data.type, data.text);
      if (data.type === 'system' && data.text.includes('Processo encerrado')) {
        isRunning = false;
        updateStatusBadge(false);
        document.getElementById('btnRun').disabled = false;
        document.getElementById('btnStop').disabled = true;
        loadQueue();
        loadStats();
      }
      if (data.type === 'system' && data.text.includes('Iniciando postagem')) {
        isRunning = true;
        updateStatusBadge(true);
        document.getElementById('btnRun').disabled = true;
        document.getElementById('btnStop').disabled = false;
      }
    } catch {}
  };
  eventSource.onerror = () => {
    addLog('system', 'Conexao perdida, reconectando em 3s...');
    setTimeout(connectSSE, 3000);
  };
}

updateClock();
setInterval(updateClock, 1000);
connectSSE();
loadStats();
loadSchedule();
loadQueue();
statsInterval = setInterval(() => { if (!isRunning) { loadStats(); loadQueue(); } }, 5000);

window.addEventListener('beforeunload', () => {
  if (eventSource) eventSource.close();
  if (statsInterval) clearInterval(statsInterval);
});
</script>
</body>
</html>
