<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio — Fábrica de Reels</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #1a1a1e; color: #f4f4f5;
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; background: #202024; border-bottom: 1px solid #2f2f35;
  flex-shrink: 0;
}
.header h1 { font-size: 18px; color: #c084fc; font-weight: 700; letter-spacing: -0.3px; }
.header h1 span { color: #f4f4f5; }
.header-right { display: flex; align-items: center; gap: 12px; }
.header-right .tag {
  font-size: 12px; color: #a1a1aa; background: #2f2f35;
  padding: 4px 10px; border-radius: 6px;
}
.btn-export {
  padding: 8px 20px; border: none; border-radius: 8px;
  background: #7c3aed; color: white; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: 0.15s;
}
.btn-export:hover { background: #6d28d9; transform: translateY(-1px); }

/* Main layout */
.main {
  display: flex; flex: 1; overflow: hidden;
}
/* Canvas (center) */
.canvas-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  background: #121214; position: relative; overflow: hidden;
}
.canvas-container {
  position: relative; border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  width: min(65vh, 360px);
  aspect-ratio: 9 / 16;
  overflow: hidden;
  cursor: crosshair;
}
#previewCanvas {
  width: 100%; height: 100%; display: block; pointer-events: none;
}
/* Overlay drag handles */
.video-overlay {
  position: absolute; border: 2px dashed rgba(124, 58, 237, 0.6);
  border-radius: 4px; cursor: move; z-index: 10;
  transition: border-color 0.15s;
}
.video-overlay:hover { border-color: #7c3aed; }
.video-overlay.active { border-color: #c084fc; border-style: solid; }
.handle {
  position: absolute; width: 12px; height: 12px;
  background: #c084fc; border: 2px solid #1a1a1e;
  border-radius: 50%; z-index: 11;
}
.handle-nw { top: -6px; left: -6px; cursor: nw-resize; }
.handle-ne { top: -6px; right: -6px; cursor: ne-resize; }
.handle-sw { bottom: -6px; left: -6px; cursor: sw-resize; }
.handle-se { bottom: -6px; right: -6px; cursor: se-resize; }

/* Zoom indicator */
.zoom-badge {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  font-size: 12px; color: #52525b; background: rgba(0,0,0,0.6);
  padding: 4px 12px; border-radius: 6px; pointer-events: none;
}

/* Sidebar (right) */
.sidebar {
  width: 340px; background: #202024; border-left: 1px solid #2f2f35;
  display: flex; flex-direction: column; overflow-y: auto;
  flex-shrink: 0;
}
.sidebar-section {
  padding: 16px 20px; border-bottom: 1px solid #2f2f35;
}
.sidebar-section:last-child { border-bottom: none; }
.sidebar-section h3 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: #71717a; margin-bottom: 12px; font-weight: 600;
}
.sidebar-section .h3-row {
  display: flex; justify-content: space-between; align-items: center;
}
.sidebar-section .h3-row .badge {
  font-size: 10px; color: #c084fc; background: rgba(124,58,237,0.15);
  padding: 2px 8px; border-radius: 4px;
}
.upload-box {
  border: 2px dashed #3f3f46; border-radius: 10px;
  padding: 20px; text-align: center; cursor: pointer;
  color: #a1a1aa; font-size: 13px; transition: 0.2s;
  background: #18181b;
}
.upload-box:hover { border-color: #7c3aed; color: #c084fc; background: #1f1f23; }
.upload-box.has-image { border-color: #4ade80; }
.upload-box.has-image .upload-icon { display: none; }
.upload-box img { max-width: 100%; max-height: 80px; border-radius: 6px; margin-top: 8px; }
.upload-icon { font-size: 28px; margin-bottom: 6px; }

.param {
  margin-bottom: 10px;
}
.param-header {
  display: flex; justify-content: space-between; font-size: 12px;
  color: #a1a1aa; margin-bottom: 4px;
}
.param-header .val { color: #c084fc; font-weight: 600; font-variant-numeric: tabular-nums; }
.param input[type="range"] {
  width: 100%; accent-color: #7c3aed;
  background: transparent; height: 4px;
  -webkit-appearance: none; appearance: none; cursor: pointer;
}
.param input[type="range"]::-webkit-slider-runnable-track {
  height: 4px; background: #3f3f46; border-radius: 2px;
}
.param input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: #7c3aed; margin-top: -6px;
  border: 2px solid #202024; box-shadow: 0 0 0 1px rgba(124,58,237,0.3);
}
.param input[type="range"]::-moz-range-track { height: 4px; background: #3f3f46; border-radius: 2px; }
.param input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: #7c3aed;
  border: 2px solid #202024;
}
.param-row { display: flex; gap: 8px; }
.param-row .param { flex: 1; }
.param input[type="text"] {
  width: 100%; padding: 6px 10px; border: 1px solid #3f3f46;
  border-radius: 6px; background: #18181b; color: #f4f4f5;
  font-size: 13px; outline: none;
}
.param input[type="text"]:focus { border-color: #7c3aed; }
.param input[type="color"] {
  width: 32px; height: 32px; border: 2px solid #3f3f46;
  border-radius: 6px; cursor: pointer; background: none; padding: 2px;
}
.presets {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.preset-btn {
  padding: 5px 12px; border: 1px solid #3f3f46; border-radius: 6px;
  background: #18181b; color: #a1a1aa; font-size: 12px; cursor: pointer;
  transition: 0.15s;
}
.preset-btn:hover { border-color: #7c3aed; color: #c084fc; background: #1f1f23; }
.preset-btn.active { border-color: #7c3aed; background: rgba(124,58,237,0.15); color: #c084fc; }
.code-box {
  background: #121214; border-radius: 8px; padding: 12px;
  font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px;
  color: #a1a1aa; white-space: pre-wrap; word-break: break-all;
  max-height: 180px; overflow-y: auto; border: 1px solid #2f2f35;
  display: none; margin-top: 8px;
}
.code-box.visible { display: block; }
.reset-link {
  font-size: 12px; color: #71717a; cursor: pointer; text-decoration: underline;
  text-underline-offset: 2px;
}
.reset-link:hover { color: #f87171; }
.preview-frame-label {
  font-size: 13px; color: #71717a; text-align: center; padding: 4px 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>Fabrica <span>Studio</span></h1>
  <div class="header-right">
    <span class="tag">1080×1920 · 30fps</span>
    <button class="btn-export" id="showCodeBtn">📋 Exportar</button>
  </div>
</div>

<div class="main">
  <!-- Canvas -->
  <div class="canvas-area">
    <div class="canvas-container" id="canvasContainer">
      <canvas id="previewCanvas"></canvas>
      <div class="video-overlay" id="overlayEl">
        <div class="handle handle-nw"></div>
        <div class="handle handle-ne"></div>
        <div class="handle handle-sw"></div>
        <div class="handle handle-se"></div>
      </div>
    </div>
    <div class="zoom-badge">100% · clique e arraste para mover</div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="h3-row">
        <h3>Template</h3>
        <span class="badge">obrigatório</span>
      </div>
      <div class="upload-box" id="uploadBox">
        <div class="upload-icon">🖼️</div>
        <div>Clique para carregar<br><span style="font-size:11px;color:#52525b;">template PNG</span></div>
      </div>
      <input type="file" id="fileInput" accept="image/png" style="display:none">
    </div>

    <div class="sidebar-section">
      <div class="h3-row">
        <h3>Posição do Vídeo</h3>
        <span class="reset-link" id="resetPos">reset</span>
      </div>
      <div class="param-row">
        <div class="param">
          <div class="param-header">X <span class="val" id="valX">0</span></div>
          <input type="range" id="posX" min="0" max="1080" value="0">
        </div>
        <div class="param">
          <div class="param-header">Y <span class="val" id="valY">290</span></div>
          <input type="range" id="posY" min="0" max="1920" value="290">
        </div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="h3-row">
        <h3>Tamanho</h3>
        <span class="reset-link" id="resetSize">reset</span>
      </div>
      <div class="param-row">
        <div class="param">
          <div class="param-header">Largura <span class="val" id="valW">1080</span></div>
          <input type="range" id="sizeW" min="100" max="1080" value="1080">
        </div>
        <div class="param">
          <div class="param-header">Altura <span class="val" id="valH">960</span></div>
          <input type="range" id="sizeH" min="100" max="1920" value="960">
        </div>
      </div>
      <div class="presets" style="margin-top:8px;">
        <button class="preset-btn" data-preset="full">Tela cheia</button>
        <button class="preset-btn" data-preset="center">Centralizado</button>
        <button class="preset-btn" data-preset="topo">Topo</button>
        <button class="preset-btn" data-preset="baixo">Base</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="h3-row">
        <h3>Bordas</h3>
        <span class="reset-link" id="resetBorder">reset</span>
      </div>
      <div class="param">
        <div class="param-header">Arredondar cantos <span class="val" id="valRadius">0</span></div>
        <input type="range" id="radius" min="0" max="60" value="0">
      </div>
    </div>

    <div class="sidebar-section">
      <div class="h3-row">
        <h3>Legenda</h3>
        <span class="reset-link" id="resetCaption">reset</span>
      </div>
      <div class="param">
        <div class="param-header">Cor</div>
        <input type="color" id="captionColor" value="#D4A574">
      </div>
      <div class="param">
        <div class="param-header">Texto</div>
        <input type="text" id="captionText" placeholder="Digite a legenda...">
      </div>
    </div>

    <div class="sidebar-section">
      <div class="h3-row">
        <h3>Exportar</h3>
        <span class="badge">FFmpeg</span>
      </div>
      <div class="code-box" id="codeBox"></div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('previewCanvas');
const ctx = canvas.getContext('2d');
const W = 1080, H = 1920;
const container = document.getElementById('canvasContainer');
const overlayEl = document.getElementById('overlayEl');

canvas.width = W; canvas.height = H;

let templateImg = null;

const posX = document.getElementById('posX');
const posY = document.getElementById('posY');
const sizeW = document.getElementById('sizeW');
const sizeH = document.getElementById('sizeH');
const radius = document.getElementById('radius');
const captionColor = document.getElementById('captionColor');
const captionText = document.getElementById('captionText');

// Sync sliders with display values
function updateDisplay() {
  document.getElementById('valX').textContent = posX.value;
  document.getElementById('valY').textContent = posY.value;
  document.getElementById('valW').textContent = sizeW.value;
  document.getElementById('valH').textContent = sizeH.value;
  document.getElementById('valRadius').textContent = radius.value;
}

// Render canvas preview
function render() {
  const x = +posX.value, y = +posY.value, w = +sizeW.value, h = +sizeH.value;
  const r = +radius.value;
  updateDisplay();

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#121214';
  ctx.fillRect(0, 0, W, H);

  if (templateImg) {
    const scale = W / templateImg.width;
    const tH = Math.round(templateImg.height * scale);
    const padY = Math.round((H - tH) / 2);
    ctx.drawImage(templateImg, 0, padY, W, tH);
  }

  // Video area indicator
  ctx.fillStyle = 'rgba(124, 58, 237, 0.07)';
  ctx.beginPath();
  if (r > 0) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
  ctx.fill();

  ctx.strokeStyle = '#7c3aed';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  ctx.beginPath();
  if (r > 0) ctx.roundRect(x, y, w, h, r);
  else ctx.rect(x, y, w, h);
  ctx.stroke();
  ctx.setLineDash([]);

  // Corner indicators
  const corners = [[x,y,'nw'],[x+w,y,'ne'],[x,y+h,'sw'],[x+w,y+h,'se']];
  for (const [cx, cy] of corners) {
    ctx.fillStyle = '#c084fc';
    ctx.beginPath();
    ctx.arc(cx, cy, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Center cross
  const cx_c = x + w / 2, cy_c = y + h / 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx_c - 15, cy_c); ctx.lineTo(cx_c + 15, cy_c);
  ctx.moveTo(cx_c, cy_c - 15); ctx.lineTo(cx_c, cy_c + 15);
  ctx.stroke();

  // Size label
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '12px system-ui';
  ctx.textAlign = 'left';
  ctx.fillText(`video ${w}×${h}px`, x + 6, y - 6);

  // Caption preview
  const txt = captionText.value.trim();
  if (txt) {
    ctx.textAlign = 'center';
    ctx.font = '26px Arial';
    const capY = y + h + 40;
    if (capY + 50 < H) {
      const tw = ctx.measureText(txt).width + 28;
      const bx = (W - tw) / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath();
      ctx.roundRect(bx, capY - 22, tw, 34, 8);
      ctx.fill();
      ctx.fillStyle = captionColor.value;
      ctx.fillText(txt, W / 2, capY + 2);
    }
  }

  // Overlay handles on HTML layer
  updateOverlayDiv(x, y, w, h);
}

function updateOverlayDiv(x, y, w, h) {
  const contRect = container.getBoundingClientRect();
  const scale = contRect.width / W;
  overlayEl.style.left = (x * scale) + 'px';
  overlayEl.style.top = (y * scale) + 'px';
  overlayEl.style.width = (w * scale) + 'px';
  overlayEl.style.height = (h * scale) + 'px';
}

// File upload
const uploadBox = document.getElementById('uploadBox');
uploadBox.addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    templateImg = img;
    uploadBox.innerHTML = `<img src="${URL.createObjectURL(file)}"><div style="font-size:12px;color:#4ade80;margin-top:4px;">✓ ${file.name}</div>`;
    uploadBox.classList.add('has-image');
    render();
  };
  img.src = URL.createObjectURL(file);
});

// Drag overlay via mouse
let isDragging = false, dragStartX, dragStartY, origX, origY;

overlayEl.addEventListener('mousedown', (e) => {
  if (e.target.classList.contains('handle')) return;
  isDragging = true;
  const contRect = container.getBoundingClientRect();
  const scale = contRect.width / W;
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  origX = +posX.value;
  origY = +posY.value;
  overlayEl.classList.add('active');
  e.preventDefault();
});

// Resize handles
document.querySelectorAll('.handle').forEach(h => {
  h.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    const contRect = container.getBoundingClientRect();
    const scale = contRect.width / W;
    const corner = h.className.includes('nw') ? 'nw' :
                  h.className.includes('ne') ? 'ne' :
                  h.className.includes('sw') ? 'sw' : 'se';
    const startX = e.clientX, startY = e.clientY;
    const ox = +posX.value, oy = +posY.value, ow = +sizeW.value, oh = +sizeH.value;

    function onMove(ev) {
      const dx = Math.round((ev.clientX - startX) / scale);
      const dy = Math.round((ev.clientY - startY) / scale);
      if (corner.includes('e')) {
        sizeW.value = Math.max(100, Math.min(1080, ow + dx));
      }
      if (corner.includes('s')) {
        sizeH.value = Math.max(100, Math.min(1920, oh + dy));
      }
      if (corner.includes('w')) {
        const nw = Math.max(0, Math.min(ox + ow - 100, ox + dx));
        sizeW.value = Math.max(100, ow + (ox - nw));
        posX.value = nw;
      }
      if (corner.includes('n')) {
        const nh = Math.max(0, Math.min(oy + oh - 100, oy + dy));
        sizeH.value = Math.max(100, oh + (oy - nh));
        posY.value = nh;
      }
      render();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      overlayEl.classList.remove('active');
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });
});

document.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const contRect = container.getBoundingClientRect();
  const scale = contRect.width / W;
  const dx = Math.round((e.clientX - dragStartX) / scale);
  const dy = Math.round((e.clientY - dragStartY) / scale);
  posX.value = Math.max(0, Math.min(1080 - sizeW.value, origX + dx));
  posY.value = Math.max(0, Math.min(1920 - sizeH.value, origY + dy));
  render();
});

document.addEventListener('mouseup', () => {
  isDragging = false;
  overlayEl.classList.remove('active');
});

// Controls
[posX, posY, sizeW, sizeH, radius, captionColor, captionText].forEach(el => {
  el.addEventListener('input', render);
  if (el.type === 'range') {
    el.addEventListener('input', () => {
      const maxX = 1080 - parseInt(sizeW.value);
      const maxY = 1920 - parseInt(sizeH.value);
      posX.max = Math.max(0, maxX);
      posY.max = Math.max(0, maxY);
      if (+posX.value > maxX) posX.value = maxX;
      if (+posY.value > maxY) posY.value = maxY;
      posX.max = 1080;
      posY.max = 1920;
    });
  }
});

// Presets
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    switch (btn.dataset.preset) {
      case 'full': posX.value=0; posY.value=0; sizeW.value=1080; sizeH.value=1920; break;
      case 'center': posX.value=0; posY.value=240; sizeW.value=1080; sizeH.value=1440; break;
      case 'topo': posX.value=0; posY.value=0; sizeW.value=1080; sizeH.value=1300; break;
      case 'baixo': posX.value=0; posY.value=500; sizeW.value=1080; sizeH.value=1400; break;
    }
    render();
  });
});

// Resets
document.getElementById('resetPos').addEventListener('click', () => {
  posX.value = 0; posY.value = 290; render();
});
document.getElementById('resetSize').addEventListener('click', () => {
  sizeW.value = 1080; sizeH.value = 960; render();
});
document.getElementById('resetBorder').addEventListener('click', () => {
  radius.value = 0; render();
});
document.getElementById('resetCaption').addEventListener('click', () => {
  captionText.value = ''; captionColor.value = '#D4A574'; render();
});

// Export
document.getElementById('showCodeBtn').addEventListener('click', () => {
  const x = posX.value, y = posY.value, w = sizeW.value, h = sizeH.value;
  const r = radius.value;
  const cap = captionText.value.trim();
  const color = captionColor.value;
  const escCap = cap.replace(/'/g, "'\\\\''").replace(/:/g, '\\:').replace(/%/g, '%%');

  let filters = `[0:v]scale=1080:-2,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:black[bg];`;
  if (r > 0) {
    filters += `[1:v]scale=w=${w}:h=${h}:force_original_aspect_ratio=increase,crop=${w}:${h}:0:(ih-${h})/2,`
    filters += `format=rgba,geq=r=r(X,Y):g=g(X,Y):b=b(X,Y):a=if(gt(${w/2-r}-abs(${w/2}-X),0)*gt(${h/2-r}-abs(${h/2}-Y),0),255,0)[video];`;
    filters += `[bg][video]overlay=${x}:${y}:shortest=1`;
  } else {
    filters += `[1:v]scale=w=${w}:h=${h}:force_original_aspect_ratio=increase,crop=${w}:${h}:0:(ih-${h})/2[video];`;
    filters += `[bg][video]overlay=${x}:${y}:shortest=1`;
  }

  if (cap) {
    const capY = +y + +h + 40;
    if (capY < 1900) {
      filters += `,drawtext=text='${escCap}':fontsize=36:fontcolor=${color}:x=(w-text_w)/2:y=${capY}:font=Arial:box=1:boxcolor=black@0.3:boxborderw=10`;
    }
  }

  const cmd = [
    'ffmpeg -y \\',
    `  -loop 1 -i "template.png" \\`,
    `  -i "reel.mp4" \\`,
    `  -filter_complex "${filters}" \\`,
    `  -c:a copy \\`,
    `  -r 30 \\`,
    `  -b:v 15M \\`,
    `  -maxrate 15M \\`,
    `  -bufsize 30M \\`,
    `  -t 60 \\`,
    `  saida_final.mp4`
  ].join('\n');

  const box = document.getElementById('codeBox');
  box.textContent = cmd;
  box.classList.add('visible');
});

render();
</script>
</body>
</html>
